vault:
  global:
    namespace: vault

  server:
    ha:
      enabled: true
      replicas: 3
      raft:
        enabled: true

platform:
  environment: production
  clusterRole: primary
  exposure:
    public: false
    ingress:
      enabled: false
  tls:
    enabled: false
    secretName: ""
    caSecretName: ""
    serverName: ""
