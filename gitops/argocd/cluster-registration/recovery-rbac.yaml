apiVersion: v1
kind: Namespace
metadata:
  name: argocd-manager
  labels:
    app.kubernetes.io/name: argocd-manager
    app.kubernetes.io/part-of: gitops-control-plane
    platform.hashicorp.com/phase: "2"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-manager
  namespace: argocd-manager
  labels:
    app.kubernetes.io/name: argocd-manager
    app.kubernetes.io/part-of: gitops-control-plane
    platform.hashicorp.com/phase: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-orders-reconciler
  labels:
    app.kubernetes.io/name: argocd-orders-reconciler
    app.kubernetes.io/part-of: gitops-control-plane
    platform.hashicorp.com/phase: "2"
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumeclaims", "secrets", "services", "serviceaccounts"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-orders-reconciler
  labels:
    app.kubernetes.io/name: argocd-orders-reconciler
    app.kubernetes.io/part-of: gitops-control-plane
    platform.hashicorp.com/phase: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-orders-reconciler
subjects:
  - kind: ServiceAccount
    name: argocd-manager
    namespace: argocd-manager
