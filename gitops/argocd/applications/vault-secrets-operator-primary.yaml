apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator-primary
  namespace: argocd
  labels:
    app.kubernetes.io/name: vault-secrets-operator
    app.kubernetes.io/part-of: gitops-control-plane
    platform.hashicorp.com/environment: primary
    platform.hashicorp.com/phase: "7"
spec:
  project: platform
  source:
    repoURL: https://github.com/Leninfitfreak/Vault.git
    targetRevision: main
    path: platform/vault-secrets-operator
    helm:
      releaseName: vault-secrets-operator
      valueFiles:
        - values/primary.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
