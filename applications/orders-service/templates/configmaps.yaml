apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.frontend.name }}-app
  namespace: {{ include "orders-service.namespace" . }}
  labels:
{{ include "orders-service.componentLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "frontend") | indent 4 }}
data:
  server.py: |
    import json
    import os
    import ssl
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    orders_url = os.getenv("ORDERS_SERVICE_URL", "http://orders-service:8080")
    mtls_enabled = os.getenv("MTLS_ENABLED", "false").lower() == "true"
    client_cert_file = os.getenv("MTLS_CLIENT_CERT_FILE")
    client_key_file = os.getenv("MTLS_CLIENT_KEY_FILE")
    ca_file = os.getenv("MTLS_CA_FILE")

    def open_orders(path):
        if mtls_enabled:
            context = ssl.create_default_context(cafile=ca_file)
            context.load_cert_chain(certfile=client_cert_file, keyfile=client_key_file)
            return urllib.request.urlopen(f"{orders_url}{path}", timeout=3, context=context)
        return urllib.request.urlopen(f"{orders_url}{path}", timeout=3)

    class Handler(BaseHTTPRequestHandler):
        def _send(self, code, payload):
            body = json.dumps(payload).encode()
            self.send_response(code)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/health":
                self._send(200, {"service": "frontend-service", "status": "ok"})
                return
            try:
                with open_orders("/orders") as response:
                    orders = json.loads(response.read().decode())
                self._send(200, {"service": "frontend-service", "orders_service": orders, "mtls_enabled": mtls_enabled})
            except Exception as exc:
                self._send(503, {"service": "frontend-service", "orders_service_error": str(exc)})

    HTTPServer(("", 8080), Handler).serve_forever()
