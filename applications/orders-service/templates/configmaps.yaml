data:
  server.py: |
    import json
    import os
    import socket
    from http.server import BaseHTTPRequestHandler, HTTPServer

    def database_probe():
        host = os.getenv("POSTGRESQL_HOST", "postgresql")
        port = int(os.getenv("POSTGRESQL_PORT", "5432"))
        with socket.create_connection((host, port), timeout=3):
            return {"host": host, "port": port, "tcp_connectivity": "ok"}

    class Handler(BaseHTTPRequestHandler):
        def _send(self, code, payload):
            body = json.dumps(payload).encode()
            self.send_response(code)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/health":
                self._send(200, {
                    "service": "orders-service",
                    "status": "ok",
                    "api_key_present": bool(os.getenv("API_KEY")),
                    "database_username_present": bool(os.getenv("DB_USERNAME")),
                })
                return
            if self.path == "/database":
                try:
                    self._send(200, {"service": "orders-service", "database": database_probe()})
                except Exception as exc:
                    self._send(503, {"service": "orders-service", "database_error": str(exc)})
                return
            if self.path == "/orders":
                self._send(200, {
                    "service": "orders-service",
                    "orders": [{"id": "order-1001", "status": "created"}],
                    "secret_source": "kubernetes-secret",
                    "database": database_probe(),
                })
                return
            self._send(404, {"error": "not found"})

    HTTPServer(("", 8080), Handler).serve_forever()
