    import json
    import os
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    orders_url = os.getenv("ORDERS_SERVICE_URL", "http://orders-service:8080")

    class Handler(BaseHTTPRequestHandler):
        def _send(self, code, payload):
            body = json.dumps(payload).encode()
            self.send_response(code)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/health":
                self._send(200, {"service": "consumer-service", "status": "ok"})
                return
            if self.path == "/call-orders":
                try:
                    with urllib.request.urlopen(f"{orders_url}/orders", timeout=3) as response:
                        payload = json.loads(response.read().decode())
                    self._send(200, {"service": "consumer-service", "orders_service": payload})
                except Exception as exc:
                    self._send(503, {"service": "consumer-service", "orders_service_error": str(exc)})
                return
            self._send(404, {"error": "not found"})

    HTTPServer(("", 8080), Handler).serve_forever()
