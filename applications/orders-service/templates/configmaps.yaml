  server.py: |
    import json
    import os
    import socket
    import ssl
    import threading
    from http.server import BaseHTTPRequestHandler, HTTPServer

    def database_probe():
        host = os.getenv("POSTGRESQL_HOST", "postgresql")
        port = int(os.getenv("POSTGRESQL_PORT", "5432"))
        with socket.create_connection((host, port), timeout=3):
            return {"host": host, "port": port, "tcp_connectivity": "ok"}

    class Handler(BaseHTTPRequestHandler):
        def _send(self, code, payload):
            body = json.dumps(payload).encode()
            self.send_response(code)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/health":
                self._send(200, {
                    "service": "orders-service",
                    "status": "ok",
                    "api_key_present": bool(os.getenv("API_KEY")),
                    "database_username_present": bool(os.getenv("DB_USERNAME")),
                })
                return
            if self.path == "/database":
                try:
                    self._send(200, {"service": "orders-service", "database": database_probe()})
                except Exception as exc:
                    self._send(503, {"service": "orders-service", "database_error": str(exc)})
                return
            if self.path == "/orders":
                client_cert = self.connection.getpeercert() if hasattr(self.connection, "getpeercert") else None
                self._send(200, {
                    "service": "orders-service",
                    "orders": [{"id": "order-1001", "status": "created"}],
                    "secret_source": "kubernetes-secret",
                    "database": database_probe(),
                    "mtls": bool(client_cert),
                })
                return
            self._send(404, {"error": "not found"})

    def run_mtls_server():
        context = ssl.create_default_context(ssl.Purpose.CLIENT_AUTH)
        context.verify_mode = ssl.CERT_REQUIRED
        context.load_cert_chain(
            certfile=os.getenv("MTLS_SERVER_CERT_FILE"),
            keyfile=os.getenv("MTLS_SERVER_KEY_FILE"),
        )
        context.load_verify_locations(cafile=os.getenv("MTLS_CA_FILE"))
        server = HTTPServer(("", int(os.getenv("MTLS_PORT", "8443"))), Handler)
        server.socket = context.wrap_socket(server.socket, server_side=True)
        server.serve_forever()

    if os.getenv("MTLS_ENABLED", "false").lower() == "true":
        threading.Thread(target=run_mtls_server, daemon=True).start()

    HTTPServer(("", 8080), Handler).serve_forever()
