{{- if and .Values.global.active .Values.secrets.vaultBacked.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: {{ .Values.secrets.vaultBacked.connectionName }}
  namespace: {{ include "orders-service.namespace" . }}
  labels:
{{ include "orders-service.componentLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "secret-sync") | indent 4 }}
spec:
  address: http://vault.vault.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ .Values.secrets.vaultBacked.authName }}
  namespace: {{ include "orders-service.namespace" . }}
  labels:
{{ include "orders-service.componentLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "secret-sync") | indent 4 }}
spec:
  vaultConnectionRef: {{ .Values.secrets.vaultBacked.connectionName }}
  method: kubernetes
  mount: {{ .Values.secrets.vaultBacked.authMount }}
  kubernetes:
    role: {{ .Values.secrets.vaultBacked.authRole }}
    serviceAccount: {{ .Values.secrets.vaultBacked.authServiceAccountName }}
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Values.orders.name }}-api-key
  namespace: {{ include "orders-service.namespace" . }}
  labels:
{{ include "orders-service.componentLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "secret-sync") | indent 4 }}
spec:
  type: kv-v2
  mount: {{ .Values.secrets.vaultBacked.mount }}
  path: {{ .Values.secrets.vaultBacked.path }}
  refreshAfter: {{ .Values.secrets.vaultBacked.refreshAfter }}
  hmacSecretData: true
  vaultAuthRef: {{ .Values.secrets.vaultBacked.authName }}
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Values.orders.name }}
  destination:
    create: true
    overwrite: false
    name: {{ .Values.secrets.vaultBacked.destinationName }}
    labels:
      app.kubernetes.io/managed-by: vault-secrets-operator
      platform.hashicorp.com/secret-source: vault
    annotations:
      platform.hashicorp.com/secret-path: {{ .Values.secrets.vaultBacked.path | quote }}
      platform.hashicorp.com/runtime-secret: "true"
{{- if .Values.secrets.dynamicDatabase.enabled }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: {{ .Values.orders.name }}-database
  namespace: {{ include "orders-service.namespace" . }}
  labels:
{{ include "orders-service.componentLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "database-secret-sync") | indent 4 }}
spec:
  mount: {{ .Values.secrets.dynamicDatabase.mount }}
  path: {{ .Values.secrets.dynamicDatabase.path }}
  renewalPercent: {{ .Values.secrets.dynamicDatabase.renewalPercent }}
  revoke: true
  vaultAuthRef: {{ .Values.secrets.vaultBacked.authName }}
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Values.orders.name }}
  destination:
    create: true
    overwrite: false
    name: {{ .Values.secrets.dynamicDatabase.destinationName }}
    labels:
      app.kubernetes.io/managed-by: vault-secrets-operator
      platform.hashicorp.com/secret-source: vault-database
    annotations:
      platform.hashicorp.com/secret-path: {{ .Values.secrets.dynamicDatabase.path | quote }}
      platform.hashicorp.com/runtime-secret: "true"
    transformation:
      excludes:
        - ".*"
      templates:
        DB_USERNAME:
          text: '{{ "{{" }} get .Secrets "username" {{ "}}" }}'
        DB_PASSWORD:
          text: '{{ "{{" }} get .Secrets "password" {{ "}}" }}'
{{- end }}
{{- end }}
