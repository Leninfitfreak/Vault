{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.ordersCredentials.name }}
  namespace: {{ include "orders-service.namespace" . }}
  labels:
{{ include "orders-service.componentLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "credentials") | indent 4 }}
  annotations:
    platform.hashicorp.com/security-note: "Fake local-only database values remain for the pre-dynamic-database phase."
type: Opaque
{{- if or .Values.secrets.ordersCredentials.databaseUsername .Values.secrets.ordersCredentials.databasePassword }}
stringData:
{{- if .Values.secrets.ordersCredentials.databaseUsername }}
  DB_USERNAME: {{ .Values.secrets.ordersCredentials.databaseUsername | quote }}
{{- end }}
{{- if .Values.secrets.ordersCredentials.databasePassword }}
  DB_PASSWORD: {{ .Values.secrets.ordersCredentials.databasePassword | quote }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.externalCredentials.name }}
  namespace: {{ include "orders-service.namespace" . }}
  labels:
{{ include "orders-service.componentLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "credentials") | indent 4 }}
  annotations:
    platform.hashicorp.com/security-note: "Fake local-only value used to simulate a legacy external API token."
type: Opaque
stringData:
  EXTERNAL_API_TOKEN: {{ .Values.secrets.externalCredentials.externalApiToken | quote }}
{{- end }}
