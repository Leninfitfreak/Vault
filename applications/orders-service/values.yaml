global:
  applicationName: orders-service
  namespace: orders
  environment: shared
  clusterRole: shared
  active: true
  managedBy: helm
  labels:
    app.kubernetes.io/part-of: orders-service
    platform.hashicorp.com/phase: "1"
    platform.hashicorp.com/secret-state: kubernetes-secrets

images:
  application:
    repository: python
    tag: "3.13-alpine"
    pullPolicy: IfNotPresent
  postgresql:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  traefik:
    repository: traefik
    tag: "v3.6"
    pullPolicy: IfNotPresent

serviceAccount:
  create: true

secrets:
  create: true
  ordersCredentials:
    name: orders-service-credentials
    databaseUsername: ""
    databasePassword: ""
  externalCredentials:
    name: external-service-credentials
    externalApiToken: fake-local-external-api-token
  vaultBacked:
    enabled: true
    connectionName: vault-primary
    authName: orders-service-vso
    authServiceAccountName: orders-service-vso
    authMount: kubernetes
    authRole: orders-service-vso
    mount: kv
    path: primary/orders/orders-service/application
    destinationName: orders-service-vault-credentials
    refreshAfter: 30s
  dynamicDatabase:
    enabled: true
    roleName: orders-service-db
    mount: database
    path: creds/orders-service-db
    destinationName: orders-service-database-credentials
    renewalPercent: 67
  pki:
    enabled: true
    mount: pki
    ttl: 15m
    renewalOffset: 300s
    serverRole: orders-service-server
    serverCommonName: orders-service.orders.svc.cluster.local
    serverAltNames:
      - orders-service
      - orders-service.orders
      - orders-service.orders.svc
      - orders-service.orders.svc.cluster.local
    serverDestinationName: orders-service-mtls-server
    clientRole: frontend-service-client
    clientCommonName: frontend-service.orders.svc.cluster.local
    clientAltNames:
      - frontend-service
      - frontend-service.orders
      - frontend-service.orders.svc
      - frontend-service.orders.svc.cluster.local
    clientDestinationName: frontend-service-mtls-client

frontend:
  name: frontend-service
  replicas: 1
  port: 8080
  mtls:
    enabled: true
    ordersUrl: https://orders-service:8443
    certMountPath: /var/run/orders-mtls/client
    caFile: /var/run/orders-mtls/client/tls.crt
    certFile: /var/run/orders-mtls/client/tls.crt
    keyFile: /var/run/orders-mtls/client/tls.key
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

orders:
  name: orders-service
  replicas: 1
  port: 8080
  mtls:
    enabled: true
    port: 8443
    certMountPath: /var/run/orders-mtls/server
    caFile: /var/run/orders-mtls/server/tls.crt
    certFile: /var/run/orders-mtls/server/tls.crt
    keyFile: /var/run/orders-mtls/server/tls.key
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

consumer:
  name: consumer-service
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

postgresql:
  name: postgresql
  database: orders
  port: 5432
  storage:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: traefik
  host: orders.local

traefik:
  enabled: true
  name: traefik
  serviceType: NodePort
  port: 80
  containerPort: 8000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
